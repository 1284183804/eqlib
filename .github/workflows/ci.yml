name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  linux:
    name: Linux / ${{ matrix.cxx }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cxx: [ g++, clang++ ]
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        env:
          CXX: ${{ matrix.cxx }}
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DEQLIB_BUILD_STATIC=ON \
            -DEQLIB_BUILD_SHARED=ON \
            -DEQLIB_BUILD_TESTS=ON \
            -DEQLIB_INSTALL=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  macos:
    name: macOS / clang++
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DEQLIB_BUILD_STATIC=ON \
            -DEQLIB_BUILD_SHARED=ON \
            -DEQLIB_BUILD_TESTS=ON \
            -DEQLIB_INSTALL=ON
      - name: Build
        run: cmake --build build --parallel
      - name: Test
        run: ctest --test-dir build --output-on-failure

  windows:
    name: Windows / MSVC
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure
        run: |
          cmake -S . -B build `
            -DEQLIB_BUILD_STATIC=ON `
            -DEQLIB_BUILD_SHARED=OFF `
            -DEQLIB_BUILD_TESTS=ON `
            -DEQLIB_INSTALL=ON
      - name: Build
        run: cmake --build build --config Release --parallel
      - name: Test
        run: ctest --test-dir build -C Release --output-on-failure
